<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThreeJS Canvas</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="scene" aria-label="Cena 3D do braco robotico"></canvas>

      <aside class="control-display" aria-label="Controles do robo">
        <section
          id="dh-panel"
          class="display-section collapsible-section is-collapsed"
          aria-label="Matrizes Denavit-Hartenberg"
        >
          <header class="section-header">
            <button
              id="dh-toggle"
              class="panel-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="dh-content"
            >
              <span>Denavit-Hartenberg</span>
              <span class="panel-toggle-icon" aria-hidden="true">+</span>
            </button>
          </header>

          <div id="dh-content" class="section-content">
            <p id="robot-status" class="robot-status"></p>
            <div id="dh-list" class="dh-list"></div>
          </div>
        </section>

        <section
          id="mqtt-panel"
          class="display-section collapsible-section is-collapsed"
          aria-label="Configuracoes MQTT"
        >
          <header class="section-header">
            <button
              id="mqtt-toggle"
              class="panel-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="mqtt-content"
            >
              <span>MQTT</span>
              <span class="panel-toggle-icon" aria-hidden="true">+</span>
            </button>
          </header>

          <form id="mqtt-content" class="section-content mqtt-form">
            <label class="form-field">
              <span>Broker</span>
              <input id="mqtt-host" type="text" value="broker.emqx.io" autocomplete="off" />
            </label>

            <div class="form-grid">
              <label class="form-field">
                <span>Protocolo</span>
                <input id="mqtt-protocol" type="text" value="mqtt" readonly />
              </label>

              <label class="form-field">
                <span>Porta</span>
                <input id="mqtt-port" type="number" value="1883" min="1" max="65535" />
              </label>
            </div>

            <label class="form-field">
              <span>Client ID</span>
              <input id="mqtt-client-id" type="text" value="threejs-robot-arm" autocomplete="off" />
            </label>

            <div class="form-grid">
              <label class="form-field">
                <span>Usuario</span>
                <input id="mqtt-username" type="text" autocomplete="username" />
              </label>

              <label class="form-field">
                <span>Senha</span>
                <input id="mqtt-password" type="password" autocomplete="current-password" />
              </label>
            </div>

            <label class="form-field">
              <span>Topico de telemetria</span>
              <input id="mqtt-telemetry-topic" type="text" value="robot/telemetry" autocomplete="off" />
            </label>

            <label class="form-field">
              <span>Topico de comando</span>
              <input id="mqtt-command-topic" type="text" value="robot/command" autocomplete="off" />
            </label>

            <section class="mqtt-publish-panel" aria-label="Publicar MQTT">
              <label class="form-field">
                <span>Payload para publicar</span>
                <textarea id="mqtt-publish-payload" rows="4">{ "msg": "hello" }</textarea>
              </label>
              <button id="mqtt-publish" class="control-button" type="button" disabled>Publicar</button>
            </section>

            <div class="mqtt-actions">
              <button id="mqtt-connect" class="control-button" type="submit">
                Conectar MQTT
              </button>
              <span id="mqtt-status" class="section-status">Desconectado</span>
            </div>

            <section class="mqtt-log-panel" aria-label="Log MQTT">
              <div class="section-title-row">
                <span>Log MQTT</span>
                <button id="mqtt-clear-log" class="text-button" type="button">Limpar</button>
              </div>
              <div id="mqtt-log" class="mqtt-log" aria-live="polite">
                <div class="mqtt-log-line muted">Aguardando conexao MQTT.</div>
              </div>
            </section>
          </form>
        </section>
      </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThreeJS Canvas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="scene" tabindex="-1" aria-label="Cena 3D do braco robotico"></canvas>

      <aside class="control-display" aria-label="Controles do robo">
        <section id="operation-mode" class="operation-mode" aria-label="Modo de operacao MQTT">
          <span class="operation-mode-label">Modo</span>
          <div class="segmented-control" role="group" aria-label="Receber ou enviar juntas">
            <button
              class="segment-button is-active"
              type="button"
              data-operation-mode="receive"
              aria-pressed="true"
            >
              Receber
            </button>
            <button
              class="segment-button"
              type="button"
              data-operation-mode="send"
              aria-pressed="false"
            >
              Enviar
            </button>
          </div>
        </section>

        <section class="display-section trajectory-options" aria-label="Medidas da trajetoria">
          <div class="section-title-row"><span>Medidas da trajetória</span></div>
          <label class="checkbox-field">
            <input id="show-point-coordinates" type="checkbox" />
            <span>Exibir coordenadas dos pontos (X, Y, Z)</span>
          </label>
          <label class="checkbox-field">
            <input id="show-segment-distances" type="checkbox" />
            <span>Exibir comprimento das retas (mm)</span>
          </label>
        </section>

        <section
          id="dh-panel"
          class="display-section collapsible-section is-collapsed"
          aria-label="Matrizes Denavit-Hartenberg"
        >
          <header class="section-header">
            <button
              id="dh-toggle"
              class="panel-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="dh-content"
            >
              <span>Denavit-Hartenberg</span>
              <span class="panel-toggle-icon" aria-hidden="true">+</span>
            </button>
          </header>

          <div id="dh-content" class="section-content">
            <p id="robot-status" class="robot-status"></p>
            <div id="dh-list" class="dh-list"></div>
          </div>
        </section>

        <section
          id="mqtt-panel"
          class="display-section collapsible-section is-collapsed"
          aria-label="Configuracoes MQTT"
        >
          <header class="section-header">
            <button
              id="mqtt-toggle"
              class="panel-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="mqtt-content"
            >
              <span>MQTT</span>
              <span class="panel-toggle-icon" aria-hidden="true">+</span>
            </button>
          </header>

          <form id="mqtt-content" class="section-content mqtt-form">
            <label class="form-field">
              <span>Broker</span>
              <input id="mqtt-host" type="text" value="broker.emqx.io" autocomplete="off" />
            </label>

            <div class="form-grid">
              <label class="form-field">
                <span>Protocolo</span>
                <select id="mqtt-protocol">
                  <option value="ws">WebSocket (WS)</option>
                  <option value="wss" selected>WebSocket seguro (WSS)</option>
                </select>
              </label>

              <label class="form-field">
                <span>Porta</span>
                <input id="mqtt-port" type="number" value="8084" min="1" max="65535" />
              </label>
            </div>

            <label class="form-field">
              <span>Caminho WebSocket</span>
              <input id="mqtt-ws-path" type="text" value="/mqtt" autocomplete="off" />
            </label>
            <p class="section-status">Conexao direta pelo navegador: use WS (8083) ou WSS (8084). Portas 1883/8883 nao funcionam aqui.</p>

            <label class="form-field">
              <span>Client ID</span>
              <input id="mqtt-client-id" type="text" value="threejs-robot-arm" autocomplete="off" />
            </label>

            <div class="form-grid">
              <label class="form-field">
                <span>Usuario</span>
                <input id="mqtt-username" type="text" autocomplete="username" />
              </label>

              <label class="form-field">
                <span>Senha</span>
                <input id="mqtt-password" type="password" autocomplete="current-password" />
              </label>
            </div>

            <label class="form-field">
              <span>Topico de telemetria</span>
              <input id="mqtt-telemetry-topic" type="text" value="robot/telemetry" autocomplete="off" />
            </label>

            <label class="form-field">
              <span>Topico de comando</span>
              <input id="mqtt-command-topic" type="text" value="robot/command" autocomplete="off" />
            </label>

            <section class="mqtt-publish-panel" aria-label="Publicar MQTT">
              <label class="form-field">
                <span>Payload para publicar</span>
                <textarea id="mqtt-publish-payload" rows="4">{ "CH-0": 0, "CH-1": 0, "CH-2": 0, "CH-3": 0, "CH-4": 0, "CH-5": 0 }</textarea>
              </label>
              <button id="mqtt-publish" class="control-button" type="button" disabled>Publicar</button>
            </section>

            <div class="mqtt-actions">
              <button id="mqtt-connect" class="control-button" type="submit">
                Conectar MQTT
              </button>
              <span id="mqtt-status" class="section-status">Desconectado</span>
            </div>

            <section class="mqtt-log-panel" aria-label="Log MQTT">
              <div class="section-title-row">
                <span>Log MQTT</span>
                <button id="mqtt-clear-log" class="text-button" type="button">Limpar</button>
              </div>
              <div id="mqtt-log" class="mqtt-log" aria-live="polite">
                <div class="mqtt-log-line muted is-placeholder">Aguardando conexao MQTT.</div>
              </div>
            </section>
          </form>
        </section>
      </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

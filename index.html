<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThreeJS Canvas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="scene" aria-label="Cena 3D do braco robotico"></canvas>

      <aside class="control-display" aria-label="Controles do robo">
        <section class="display-section workspace-section" aria-label="Area de trabalho">
          <div class="section-title-row">
            <span>Area de trabalho</span>
            <span id="workspace-state" class="section-status">Oculta</span>
          </div>
          <button id="workspace-toggle" class="control-button" type="button" aria-pressed="false">
            Mostrar area de trabalho
          </button>
        </section>

        <section
          id="dh-panel"
          class="display-section collapsible-section is-collapsed"
          aria-label="Matrizes Denavit-Hartenberg"
        >
          <header class="section-header">
            <button
              id="dh-toggle"
              class="panel-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="dh-content"
            >
              <span>Denavit-Hartenberg</span>
              <span class="panel-toggle-icon" aria-hidden="true">+</span>
            </button>
          </header>

          <div id="dh-content" class="section-content">
            <p id="robot-status" class="robot-status"></p>
            <div id="dh-list" class="dh-list"></div>
          </div>
        </section>

        <section
          id="mqtt-panel"
          class="display-section collapsible-section is-collapsed"
          aria-label="Configuracoes MQTT"
        >
          <header class="section-header">
            <button
              id="mqtt-toggle"
              class="panel-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="mqtt-content"
            >
              <span>MQTT</span>
              <span class="panel-toggle-icon" aria-hidden="true">+</span>
            </button>
          </header>

          <form id="mqtt-content" class="section-content mqtt-form">
            <label class="form-field">
              <span>Broker</span>
              <input id="mqtt-host" type="text" value="localhost" autocomplete="off" />
            </label>

            <div class="form-grid">
              <label class="form-field">
                <span>Protocolo</span>
                <select id="mqtt-protocol">
                  <option value="ws">ws</option>
                  <option value="wss">wss</option>
                  <option value="mqtt">mqtt</option>
                </select>
              </label>

              <label class="form-field">
                <span>Porta</span>
                <input id="mqtt-port" type="number" value="9001" min="1" max="65535" />
              </label>
            </div>

            <label class="form-field">
              <span>Path WebSocket</span>
              <input id="mqtt-path" type="text" value="/mqtt" autocomplete="off" />
            </label>

            <label class="form-field">
              <span>Client ID</span>
              <input id="mqtt-client-id" type="text" value="threejs-robot-arm" autocomplete="off" />
            </label>

            <div class="form-grid">
              <label class="form-field">
                <span>Usuario</span>
                <input id="mqtt-username" type="text" autocomplete="username" />
              </label>

              <label class="form-field">
                <span>Senha</span>
                <input id="mqtt-password" type="password" autocomplete="current-password" />
              </label>
            </div>

            <label class="form-field">
              <span>Topico de telemetria</span>
              <input id="mqtt-telemetry-topic" type="text" value="robot/telemetry" autocomplete="off" />
            </label>

            <label class="form-field">
              <span>Topico de comando</span>
              <input id="mqtt-command-topic" type="text" value="robot/command" autocomplete="off" />
            </label>

            <div class="mqtt-actions">
              <button id="mqtt-connect" class="control-button" type="submit">
                Conectar MQTT para habilitar
              </button>
              <span id="mqtt-status" class="section-status">Desconectado</span>
            </div>
          </form>
        </section>
      </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
